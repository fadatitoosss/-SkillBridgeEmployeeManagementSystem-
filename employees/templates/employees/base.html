{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Employee management system</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
        <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
        <link href="{% static 'css/main.css' %}" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
        <script src="{% static 'js/main.js' %}" defer></script>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
        <body class="d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'landing' %}">
    <i class="fa-regular fa-user fa-lg"></i>
    <span class="d-none d-sm-inline">Employee Management System</span>
    <span class="d-inline d-sm-none">EMS</span>
</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01" aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarColor01">
      <ul class="navbar-nav me-auto">
        
        <li class="nav-item">
        <a class="nav-link" href="{% url 'index' %}"> 
            <i class="fa-solid fa-list fa-lg"></i>All Employees
        </a>
        </li>
      </ul>
      {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-2">
            <span class="text-light small">{{ user.username }}</span>
            <form method="POST" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">Log Out</button>
            </form>
        </div>
        {% endif %}
    </div>
  </div>
</nav>
{% include 'employees/includes/messages.html' %}
            <div class=""container-fluid>
                {% block body %}
                {% endblock %}

            </div>
            <footer class="mt-auto mb-4">
                <div class="text-center">
                    <span>
                        Copyright &copy; <script>document.write(new Date().getFullYear())</script> Aura.
                    </span>
                </div>
            </footer>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
        </body>
    
</html>
